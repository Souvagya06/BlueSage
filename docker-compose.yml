version: "3.9"

services:
  # ─── PostgreSQL + PostGIS ───────────────────────────────────
  db:
    image: postgis/postgis:15-3.3
    container_name: waterbody_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waterbody_db}
      POSTGRES_USER: ${POSTGRES_USER:-waterbody_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waterbody_pass_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/data_pipeline/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waterbody_user} -d ${POSTGRES_DB:-waterbody_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waterbody_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ─── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waterbody_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
